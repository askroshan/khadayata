name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit & static invariant tests
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npx vitest run src/test/global-id-hardening.test.ts src/test/matrimonial-constants.test.ts src/test/matrimonial-photo.test.tsx src/test/email-templates.test.ts src/test/email-provider.test.ts src/test/admin-otp.test.ts src/test/navigation-integrity.test.ts src/test/role-tab-matrix.test.ts src/test/permissions-matrix.test.ts src/test/route-guards.test.ts
